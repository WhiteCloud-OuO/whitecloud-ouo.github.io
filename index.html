<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的名字 | 个人主页</title>
  <meta name="description" content="你的个人主页，记录项目、博客和联系方式。">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.7;
    }
    h1 { margin-bottom: 0.2rem; }
    .subtitle { color: #666; margin-top: 0; }
    nav a { margin-right: 1rem; }
    section { margin-top: 2rem; }
    footer { margin-top: 3rem; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>你的名字</h1>
    <p class="subtitle">一句话介绍自己，比如：前端开发者 / 学生 / 爱好者</p>
    <nav>
      <a href="#about">关于</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>关于我</h2>
      <p>这里写你的个人介绍。</p>
    </section>

    <section id="projects">
      <h2>项目</h2>
      <ul>
        <li>
          <a href="https://github.com/你的用户名/仓库名">项目名</a>
          ：一句话说明这个项目。
        </li>
      </ul>
    </section>

    <section id="contact">
      <h2>联系</h2>
      <p>GitHub：<a href="https://github.com/你的用户名">@你的用户名</a></p>
      <p>邮箱：<a href="mailto:你的邮箱">你的邮箱</a></p>
    </section>
  </main>

  <footer>
    <p>© 2025 你的名字</p>
  </footer>
</body>
</html>
